function drawChart(){const canvas=$('analysisChart'); if(!canvas)return; const ctx=canvas.getContext('2d'); const w=canvas.width,h=canvas.height; ctx.clearRect(0,0,w,h); ctx.strokeStyle='#e5e7eb'; ctx.lineWidth=1; for(let i=0;i<6;i++){let y=30+i*55; ctx.beginPath(); ctx.moveTo(40,y); ctx.lineTo(w-20,y); ctx.stroke()} const prices=[25,32,60,140,380,920,1890,2800,2831,2521,2860,1800,2843,5000,4000,420,1400]; const vols=[2,3,5,9,18,36,72,98,88,64,70,54,81,120,96,42,58]; const maxP=Math.max(...prices), maxV=Math.max(...vols); const step=(w-80)/(prices.length-1); ctx.beginPath(); prices.forEach((p,i)=>{const x=50+i*step,y=h-50-(p/maxP)*(h-90); if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y)}); ctx.strokeStyle='#dc2626'; ctx.lineWidth=2.5; ctx.stroke(); vols.forEach((v,i)=>{const x=45+i*step; const bh=(v/maxV)*90; ctx.fillStyle='#2563eb'; ctx.globalAlpha=.55; ctx.fillRect(x,h-40-bh,10,bh); ctx.globalAlpha=1}); ctx.strokeStyle='#d97706'; ctx.setLineDash([5,4]); ctx.beginPath(); ctx.moveTo(50,h-170); ctx.lineTo(w-20,h-170); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle='#64748b'; ctx.font='12px Pretendard, sans-serif'; ctx.fillText('가격 급등 구간 / 거래량 집중 / 관여율 99% 기준선',50,24);}

function openFraudModal(){ $('modalTitle').textContent='부정거래 근거자료 등록'; $('modalDesc').textContent='SNS·뉴스·제보·온체인 신호를 증거보존 상태와 함께 등록합니다.'; $('modalBody').innerHTML=`<div class="form-grid three"><div><label>자산</label><input value="TEST"></div><div><label>마켓</label><input value="TEST/KRW"></div><div><label>자료유형</label><select><option>허위호재</option><option>리딩방 유포</option><option>뉴스/블로그</option><option>온체인 이상징후</option></select></div><div><label>채널</label><input value="SNS/X"></div><div><label>수집시각</label><input value="2026-05-06 10:00"></div><div><label>증거보존</label><select><option>캡처완료</option><option>증거보존필요</option><option>TxHash확보</option></select></div><div class="full"><label>URL/TX/자료내용</label><textarea>게시글 URL, 캡처 경로, 제보 원본, TxHash 등을 입력</textarea></div></div>`; $('modal').classList.add('show'); }
document.addEventListener('click',e=>{const nav=e.target.closest('.navbtn'); if(nav){setPage(nav.dataset.page);return} const g=e.target.closest('[data-goto]'); if(g){setPage(g.dataset.goto);return} const ext=e.target.closest('[data-ext]'); if(ext){selectedExtraction=ext.dataset.ext; const linked=ex().caseId; if(linked)selectedCase=linked; render();return} const cs=e.target.closest('[data-case]'); if(cs){selectedCase=cs.dataset.case; const first=groups.find(g=>g.caseId===selectedCase); if(first)selectedGroup=first.id; render();return} const prev=e.target.closest('[data-prev]'); if(prev){selectedPrevent=prev.dataset.prev; render();return} const gr=e.target.closest('[data-group]'); if(gr){selectedGroup=gr.dataset.group; render();return} const inf=e.target.closest('[data-info]'); if(inf){selectedInfoEvent=inf.dataset.info; render();return} const sigEl=e.target.closest('[data-sig]'); if(sigEl){selectedFraudSignal=sigEl.dataset.sig; render();return} const act=e.target.closest('[data-action]'); if(act){const a=act.dataset.action; if(a==='closeModal')$('modal').classList.remove('show'); if(a==='openInfoModal')openInfoModal(); if(a==='openFraudModal')openFraudModal(); if(a==='saveModal'){addAudit('등록정보','샘플 저장'); $('modal').classList.remove('show'); render()} if(a==='transferCase'){addAudit(selectedExtraction,'심리이관 요청'); setPage('extractBridge')} if(a==='requestClose'){addAudit(selectedExtraction,'종결 승인요청'); setPage('approvalHub')} if(a==='simulateAuto'){addAudit('자동룰','재실행'); render()} }});
render();
})();
